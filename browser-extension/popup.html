<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipe Scraper</title>
  <style>
    /* Light: warm paper. Dark (follows the system): tinted plum. One accent: tomato. */
    :root {
      color-scheme: light dark;
      --bg: #FAF9F5;
      --surface: #FFFFFF;
      --surface-sunk: #F0EEE6;
      --text: #141413;
      --text-muted: #73726C;
      --text-faint: #A3A29C;
      --line: #E8E6DC;
      --line-strong: #D6D3C7;
      --accent: #D9442B;
      --accent-text: #B5341D;
      --accent-soft: rgba(217, 68, 43, 0.12);
      --warn-text: #92560B;
      --primary-bg: #141413;
      --primary-bg-hover: #3D3D3A;
      --primary-text: #FAF9F5;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Iowan Old Style', Charter, Georgia, Cambria, serif;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #21141E;
        --surface: #2B1B27;
        --surface-sunk: #1A1018;
        --text: #F2E6EE;
        --text-muted: #9A8494;
        --text-faint: #6E5A68;
        --line: #33232F;
        --line-strong: #4A3645;
        --accent: #F0674D;
        --accent-text: #FFB4A6;
        --accent-soft: rgba(240, 103, 77, 0.2);
        --warn-text: #F2C46D;
        --primary-bg: rgba(240, 103, 77, 0.24);
        --primary-bg-hover: rgba(240, 103, 77, 0.34);
        --primary-text: #FFD9D1;
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      width: 400px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
    }

    [hidden] { display: none !important; }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- Top bar ---------- */

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 10px 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .brand svg { width: 16px; height: 16px; }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-muted);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover { background: var(--surface-sunk); color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:disabled { cursor: default; }
    .icon-btn:disabled svg { animation: spin 0.8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Scrolling content ---------- */

    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 16px 16px;
    }

    .state {
      padding: 24px 4px;
      text-align: center;
      color: var(--text-muted);
    }

    .state:empty { display: none; }

    .state strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-weight: 500;
    }

    /* Recipe picker (pages with several recipes) */

    .picker-title {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .picker-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .picker-list button {
      padding: 12px 14px;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      text-align: left;
      transition: background-color 0.15s ease;
    }

    .picker-list button:first-child { border-top: 0; }
    .picker-list button:hover { background: var(--surface-sunk); }

    /* ---------- Recipe card ---------- */

    .recipe-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.01em;
      overflow-wrap: break-word;
    }

    .meta {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .meta:empty { display: none; }

    .meta a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--line-strong);
      text-underline-offset: 2px;
    }

    .meta a:hover { color: var(--text); }

    .link-btn {
      margin-top: 6px;
      padding: 0;
      border: 0;
      background: none;
      font-size: 13px;
      color: var(--accent-text);
    }

    .link-btn:hover { text-decoration: underline; }

    .segmented {
      display: flex;
      gap: 2px;
      margin: 16px 0 4px;
      padding: 2px;
      border-radius: var(--radius);
      background: var(--surface-sunk);
    }

    .segmented button {
      flex: 1;
      padding: 5px 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .segmented button:hover { color: var(--text); }

    .segmented button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 0 0 1px var(--line);
    }

    @media (prefers-color-scheme: dark) {
      .segmented button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--primary-text);
        box-shadow: none;
      }
    }

    h2 {
      margin: 24px 0 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    h3 {
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: 500;
    }

    .hint {
      margin: -4px 0 8px;
      font-size: 12px;
      color: var(--text-faint);
    }

    .ingredients {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .ingredients li + li { border-top: 1px solid var(--line); }

    .ingredients label {
      display: flex;
      gap: 10px;
      padding: 7px 0;
      cursor: pointer;
    }

    .ingredients input {
      flex: none;
      width: 15px;
      height: 15px;
      margin: 3px 0 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .ingredient-text { overflow-wrap: anywhere; }

    .ingredients .was,
    .ingredients .note {
      display: block;
      font-size: 12px;
    }

    .ingredients .was { color: var(--text-faint); }
    .ingredients .note { color: var(--warn-text); }

    .ingredients li.done .ingredient-text {
      color: var(--text-faint);
      text-decoration: line-through;
    }

    .steps {
      margin: 0;
      padding-left: 22px;
    }

    .steps li {
      padding-left: 4px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .steps li::marker {
      color: var(--accent-text);
      font-weight: 500;
    }

    /* ---------- Actions ---------- */

    .actions {
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .toast {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--accent-text);
    }

    .toast:empty { display: none; }

    .saved {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .saved .path {
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .saved .link-btn {
      display: block;
      margin-top: 2px;
      font-size: 12px;
    }

    .btn:disabled { cursor: default; opacity: 0.7; }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 8px 16px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      box-shadow: 0 0 0 1px var(--line-strong);
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover { background: var(--surface-sunk); }

    .btn.primary {
      background: var(--primary-bg);
      color: var(--primary-text);
      box-shadow: none;
    }

    .btn.primary:hover { background: var(--primary-bg-hover); }

    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <span class="brand">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="9.5" r="5.5" fill="var(--accent)"/>
        <path d="M8 4.2V2.2M8 4.2C6.8 3 5.4 2.9 4.4 3.4M8 4.2c1.2-1.2 2.6-1.3 3.6-.8" fill="none" stroke="#4D7C2A" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      Recipe Scraper
    </span>
    <button id="rescanBtn" class="icon-btn" aria-label="Scan page again" title="Scan page again">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/>
        <path d="M13.5 2.5v3h-3"/>
      </svg>
    </button>
  </header>

  <main>
    <div id="status" class="state" role="status" aria-live="polite"></div>

    <section id="picker" hidden>
      <p id="pickerTitle" class="picker-title"></p>
      <div id="pickerList" class="picker-list"></div>
    </section>

    <article id="recipe" hidden>
      <h1 id="recipeTitle" class="recipe-title"></h1>
      <p id="recipeMeta" class="meta"></p>
      <button id="otherRecipesBtn" class="link-btn" hidden></button>

      <div class="segmented" role="group" aria-label="Recipe size">
        <button class="scale-btn" data-scale="0.5" aria-pressed="false" title="Half">½×</button>
        <button class="scale-btn" data-scale="1" aria-pressed="true" title="Original">1×</button>
        <button class="scale-btn" data-scale="2" aria-pressed="false" title="Double">2×</button>
        <button class="scale-btn" data-scale="3" aria-pressed="false" title="Triple">3×</button>
      </div>

      <h2>Ingredients</h2>
      <ul id="ingredients" class="ingredients"></ul>

      <section id="stepsSection">
        <h2>Steps</h2>
        <p id="stepsHint" class="hint" hidden>Steps aren't scaled. Check any amounts they mention.</p>
        <div id="steps"></div>
      </section>
    </article>
  </main>

  <footer id="actions" class="actions" hidden>
    <p id="toast" class="toast" role="status" aria-live="polite"></p>
    <div id="saved" class="saved" role="status" hidden>
      <span>Saved to <span id="savedPath" class="path"></span></span>
      <button id="showFileBtn" class="link-btn">Show in folder</button>
    </div>
    <div class="action-row">
      <button id="copyBtn" class="btn primary">Copy</button>
      <button id="downloadBtn" class="btn">Save .txt</button>
    </div>
  </footer>

  <script src="recipe.js"></script>
  <script src="popup.js"></script>
</body>
</html>
